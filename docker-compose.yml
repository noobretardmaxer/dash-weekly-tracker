services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydradb
      POSTGRES_PASSWORD: hydradb
      POSTGRES_DB: hydradb_growth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on 5433 (not 5432) to avoid clashing with a locally-installed Postgres;
    # only needed for running `prisma migrate`/`prisma db seed` from the host during
    # local development — the api/worker services talk to `postgres:5432` internally.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydradb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./server
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MOCK_MODE: "true"
      DATABASE_URL: postgresql://hydradb:hydradb@postgres:5432/hydradb_growth?schema=public
      REDIS_URL: redis://redis:6379
      SCHEDULER_DRIVER: bullmq
      PORT: "4000"

  worker:
    build:
      context: ./server
    command: node dist/worker.js
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MOCK_MODE: "true"
      DATABASE_URL: postgresql://hydradb:hydradb@postgres:5432/hydradb_growth?schema=public
      REDIS_URL: redis://redis:6379
      SCHEDULER_DRIVER: bullmq

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
