services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hydradb
      POSTGRES_PASSWORD: hydradb
      POSTGRES_DB: hydradb_growth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Published on 5433 (not 5432) to avoid clashing with a locally-installed Postgres;
    # only needed for running `prisma migrate`/`prisma db seed` from the host during
    # local development — the api/worker services talk to `postgres:5432` internally.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydradb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command: node dist/server.js
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "4000:4000"

  worker:
    build:
      context: ./backend
    command: node dist/worker.js
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
